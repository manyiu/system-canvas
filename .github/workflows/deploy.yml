name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    # Skip until operator bootstrap sets AWS_ROLE_ARN (see infra/README.md).
    if: ${{ vars.AWS_ROLE_ARN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-1' }}

      - name: CDK deploy
        working-directory: infra
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
          HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
        run: |
          npx cdk deploy --all \
            --require-approval never \
            -c account="$AWS_ACCOUNT_ID" \
            -c hostedZoneId="$HOSTED_ZONE_ID"

      - name: Sync static assets to S3
        env:
          SITE_BUCKET: ${{ vars.SITE_BUCKET_NAME }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          BUCKET="${SITE_BUCKET:-system-canvas-site-${AWS_ACCOUNT_ID}}"
          aws s3 sync packages/app/dist "s3://${BUCKET}" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html" \
            --exclude "*.html"
          aws s3 sync packages/app/dist "s3://${BUCKET}" \
            --exclude "*" \
            --include "*.html" \
            --cache-control "public,max-age=0,must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront
        env:
          DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -z "$DISTRIBUTION_ID" ]; then
            echo "CLOUDFRONT_DISTRIBUTION_ID is not set" >&2
            exit 1
          fi
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"
